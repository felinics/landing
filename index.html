<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- app-meta-start -->
    <!-- 静态 meta 与 scripts/create-spa-fallback.mjs 的 pages.home 保持一致;未知路由(404.html)也用这套兜底 -->
    <title>Memoh — The multi-agent platform</title>
    <meta name="description" content="Every agent gets its own computer with a desktop, filesystem, and network. Always on, always there." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://memoh.ai/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Memoh" />
    <meta property="og:title" content="Memoh — The multi-agent platform" />
    <meta property="og:description" content="Every agent gets its own computer with a desktop, filesystem, and network. Always on, always there." />
    <meta property="og:url" content="https://memoh.ai/" />
    <meta property="og:image" content="https://memoh.ai/logo.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Memoh — The multi-agent platform" />
    <meta name="twitter:description" content="Every agent gets its own computer with a desktop, filesystem, and network. Always on, always there." />
    <meta name="twitter:image" content="https://memoh.ai/logo.png" />
    <!-- app-meta-end -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;0,8..60,600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vueuse-color-scheme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) document.documentElement.classList.add('dark');
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground font-sans antialiased selection:bg-primary/20 selection:text-primary">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
